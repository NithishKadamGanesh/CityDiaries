name: Keep Render Alive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CityDiaries to respond online
        run: |
          for i in {1..10}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://citydiaries.onrender.com/)
            echo "Attempt $i: HTTP $code"
            if [ "$code" -eq 200 ]; then
              echo "Service is online."
              exit 0
            fi
            sleep 6
          done
          echo "Service did not report online after retries."
          exit 1
