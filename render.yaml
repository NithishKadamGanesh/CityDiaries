services:
  - type: web
    name: citydiaries
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Auto-generated by Render; signs the session cookie.
      - key: SESSION_SECRET
        generateValue: true
      # Seed demo spots once on first boot (skipped if the DB already has data).
      - key: SEED_DEMO_DATA
        value: "true"
      # Secrets: set these in the Render dashboard (Environment tab).
      - key: MONGO_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_KEY
        sync: false
      - key: CLOUDINARY_SECRET
        sync: false
